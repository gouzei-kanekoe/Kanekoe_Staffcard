<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>天國管理局 — 職員證</title>
  <script>
    document.documentElement.classList.add('spoiler-active');
  </script>
  <style>
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-Light.otf') format('opentype'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-Medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-SemiBold.otf') format('opentype'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-Bold.otf') format('opentype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'SHSTC'; src: url('fonts/SourceHanSerifTC-Heavy.otf') format('opentype'); font-weight: 900; font-display: swap; }

    :root {
      --font: 'SHSTC', 'Noto Serif TC', 'Songti TC', 'SimSun', serif;
      --page-bg: #cbc7be;
      --card-bg: #ffffff;
      --ink: #000000;
      --ink-muted: rgba(0, 0, 0, 0.44);
      --ink-soft: rgba(0, 0, 0, 0.28);
      --ink-faint: rgba(0, 0, 0, 0.14);
      --ghost: rgba(0, 0, 0, 0.045);
      --menu-base: rgba(0, 0, 0, 0.38);
      --menu-line: rgba(0, 0, 0, 0.12);
      --accent: #464e66;
      --shadow-soft: 0 20px 48px rgba(82, 72, 54, 0.10);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --card-w: 295px;
      --card-h: calc(var(--card-w) * 1.531);
      --story-panel-w: min(360px, 38vw);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--page-bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: clamp(22px, 4vw, 44px);
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    .page-frame {
      width: min(1120px, 100%);
      min-height: calc(100dvh - clamp(44px, 8vw, 88px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3vw, 34px);
    }

    .page-heading {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 12px;
      padding-inline: clamp(2px, 0.6vw, 8px);
    }

    .heading-main {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .page-kicker {
      font-size: clamp(10px, 0.92vw, 13px);
      letter-spacing: 0.58em;
      color: rgba(0, 0, 0, 0.32);
      white-space: nowrap;
    }

    .page-title {
      font-size: clamp(18px, 1.8vw, 28px);
      letter-spacing: 0.68em;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .staff-shell {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: clamp(28px, 4vw, 54px);
      align-items: start;
    }

    .staff-menu-panel {
      border-right: 1px solid var(--menu-line);
      padding-right: clamp(12px, 1.6vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    .menu-title {
      font-size: 12px;
      letter-spacing: 0.52em;
      color: rgba(0, 0, 0, 0.28);
      white-space: nowrap;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      position: relative;
      border: none;
      background: none;
      padding: 12px 18px 12px 0;
      text-align: left;
      color: var(--menu-base);
      cursor: pointer;
      font-size: clamp(14px, 1.12vw, 18px);
      letter-spacing: 0.58em;
      transition:
        color 0.28s var(--ease-out),
        transform 0.28s var(--ease-out),
        opacity 0.28s var(--ease-out);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 0;
      height: 1px;
      background: currentColor;
      transform: translateY(-50%);
      transition: width 0.28s var(--ease-out);
      opacity: 0.9;
    }

    .menu-item::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: transparent;
      transform: translateY(-50%) scale(0.72);
      transition:
        background-color 0.28s var(--ease-out),
        transform 0.28s var(--ease-out);
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      color: var(--accent);
      transform: translateX(6px);
      outline: none;
    }

    .menu-item:hover::before,
    .menu-item:focus-visible::before {
      width: 24px;
    }

    .menu-item.is-active {
      color: var(--accent);
      transform: translateX(8px);
    }

    .menu-item.is-active::before {
      width: 32px;
    }

    .menu-item.is-active::after {
      background: var(--accent);
      transform: translateY(-50%) scale(1);
    }

    .menu-item.is-locked {
      color: rgba(0, 0, 0, 0.26);
    }

    .menu-item.is-locked:hover,
    .menu-item.is-locked:focus-visible {
      color: var(--accent);
    }

    .menu-item-label {
      display: inline-block;
      padding-left: 40px;
    }

    .viewer-panel {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
    }

    .viewer-workspace {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      column-gap: 0;
      row-gap: 0;
      transition: column-gap 0.56s var(--ease-out), row-gap 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open {
      column-gap: clamp(18px, 2.8vw, 34px);
    }

    .viewer-stage {
      width: var(--card-w);
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 1300px;
      min-width: 0;
    }

    .viewer-card-shell {
      width: min(100%, var(--card-w));
      transform-origin: center top;
      transition: opacity 0.3s var(--ease-out), transform 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open .viewer-card-shell {
      transform: translateX(-18px) scale(0.936);
    }

    .viewer-card-shell.is-transitioning {
      pointer-events: none;
    }

    .story-panel-shell {
      width: 0;
      flex: 0 0 auto;
      overflow: hidden;
      opacity: 0;
      transform: translateX(28px);
      pointer-events: none;
      transition:
        width 0.56s var(--ease-out),
        opacity 0.34s var(--ease-out),
        transform 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open .story-panel-shell {
      width: var(--story-panel-w);
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .story-panel {
      width: var(--story-panel-w);
      height: calc(var(--card-h) - 2px);
      padding: 22px 22px 18px;
      border: 1px solid rgba(0, 0, 0, 0.10);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(250, 250, 250, 0.93)),
        rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
    }

    .story-panel-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .story-panel-kicker {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.48em;
      color: rgba(70, 78, 102, 0.54);
      white-space: nowrap;
    }

    .story-panel-title {
      font-size: clamp(18px, 1.5vw, 22px);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(28, 31, 39, 0.92);
      line-height: 1.35;
    }

    .story-panel-copy {
      overflow-y: auto;
      padding-right: 8px;
      color: rgba(38, 38, 38, 0.82);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.9;
      text-wrap: pretty;
      user-select: text;
      -webkit-user-select: text;
      overscroll-behavior: contain;
    }

    .story-panel-copy p + p {
      margin-top: 14px;
    }

    .story-panel-copy::-webkit-scrollbar {
      width: 6px;
    }

    .story-panel-copy::-webkit-scrollbar-thumb {
      background: rgba(70, 78, 102, 0.18);
      border-radius: 999px;
    }

    .story-panel-copy::-webkit-scrollbar-track {
      background: transparent;
    }

    .story-close-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-self: flex-start;
      border: none;
      background: none;
      color: rgba(70, 78, 102, 0.86);
      cursor: pointer;
      padding: 0 0 2px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.34em;
      transition: color 0.28s var(--ease-out), transform 0.28s var(--ease-out), opacity 0.28s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .story-close-button::before {
      content: '';
      width: 18px;
      height: 1px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .story-close-button:hover,
    .story-close-button:focus-visible {
      color: var(--accent);
      transform: translateX(-2px);
      outline: none;
    }

    .story-close-button:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .card-scene {
      width: min(100%, var(--card-w));
      height: var(--card-h);
      perspective: 1100px;
      margin: 0 auto;
    }

    .card-tilt {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card-tilt.spring-back {
      transition: transform 0.64s var(--ease-out);
    }

    .card-flip {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.82s var(--ease-out);
      cursor: pointer;
      will-change: transform;
    }

    .card-flip.is-flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      border: 1px solid var(--ink-faint);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .face.back {
      transform: rotateY(180deg);
    }

    .card-caption {
      display: none;
    }

    .f-inner,
    .b-inner {
      width: 100%;
      height: 100%;
      position: relative;
      background: var(--card-bg);
    }

    .f-inner {
      padding: clamp(24px, 5.5%, 34px) clamp(26px, 5.8%, 34px) clamp(24px, 5%, 30px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }

    .f-header {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 18px);
      min-height: 42px;
    }

    .f-seal {
      flex: 0 0 auto;
      display: block;
    }

    .f-org {
      font-size: clamp(12px, 1.34vw, 16px);
      font-weight: 700;
      letter-spacing: 0.74em;
      line-height: 1;
      white-space: nowrap;
    }

    .f-rule {
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.14);
      margin-top: clamp(22px, 4.4%, 30px);
    }

    .f-media {
      display: flex;
      align-items: flex-start;
      padding-top: clamp(24px, 4.8%, 30px);
      min-height: 0;
    }

    .f-photo {
      appearance: none;
      display: block;
      width: 58.6%;
      aspect-ratio: 148 / 190;
      border: 1px solid rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
      padding: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(252, 252, 252, 0.98)),
        repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.025) 0,
          rgba(0, 0, 0, 0.025) 1px,
          transparent 1px,
          transparent 54px
        );
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68);
      cursor: pointer;
      z-index: 1;
      transition:
        transform 0.44s var(--ease-out),
        box-shadow 0.44s var(--ease-out),
        border-color 0.28s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .f-photo.is-empty::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(0, 0, 0, 0.02));
      pointer-events: none;
    }

    .f-photo:hover,
    .f-photo:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(70, 78, 102, 0.26);
      box-shadow:
        0 16px 26px rgba(72, 76, 93, 0.10),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      outline: none;
    }

    .f-photo:disabled {
      cursor: default;
      transform: none;
      border-color: rgba(0, 0, 0, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68);
    }

    .f-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .f-photo-hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: inline-flex;
      align-items: center;
      padding: 4px 8px 4px 10px;
      border: 1px solid rgba(70, 78, 102, 0.12);
      background: rgba(255, 255, 255, 0.86);
      color: rgba(70, 78, 102, 0.78);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.34em;
      line-height: 1;
      pointer-events: none;
      z-index: 2;
      opacity: 0.76;
      transform: translateY(3px);
      transition: opacity 0.28s var(--ease-out), transform 0.28s var(--ease-out), color 0.28s var(--ease-out);
    }

    .f-photo:hover .f-photo-hint,
    .f-photo:focus-visible .f-photo-hint {
      opacity: 1;
      transform: translateY(0);
      color: var(--accent);
    }

    .f-photo:disabled .f-photo-hint {
      opacity: 0.82;
      color: rgba(82, 82, 82, 0.58);
      background: rgba(244, 244, 244, 0.88);
    }

    .f-watermark {
      position: absolute;
      top: clamp(104px, 23.5%, 118px);
      right: clamp(6px, 1.4vw, 12px);
      bottom: clamp(34px, 8%, 42px);
      writing-mode: vertical-rl;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(76px, 8vw, 84px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: rgba(0, 0, 0, 0.048);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      transform: translateX(-4px);
      z-index: 0;
    }

    .f-watermark[data-type="歸屬證"] {
      right: clamp(4px, 1.2vw, 10px);
    }

    .f-info {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vw, 12px);
      padding-top: clamp(10px, 2%, 16px);
      z-index: 1;
    }

    .f-row {
      display: flex;
      align-items: baseline;
      gap: 0;
      font-size: clamp(14px, 1.38vw, 19px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.55;
      color: var(--ink);
      white-space: nowrap;
    }

    .f-lbl {
      flex: 0 0 3.7em;
      color: var(--ink-muted);
      letter-spacing: 0.14em;
      min-width: 0;
    }

    #name-display,
    #role-display {
      display: block;
      min-width: 0;
    }

    .sealed-name {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      border: none;
      background: none;
      color: #000000;
      cursor: pointer;
      padding: 0;
      letter-spacing: 0;
      font-size: inherit;
      line-height: inherit;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .name-row {
      position: relative;
    }

    .sealed-name::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.12em;
      height: 1px;
      background: rgba(0, 0, 0, 0.16);
      transform: scaleX(1);
      transform-origin: center;
      opacity: 1;
      transition: transform 0.28s var(--ease-out), opacity 0.28s var(--ease-out);
    }

    .sealed-name:hover,
    .sealed-name:focus-visible {
      color: #000000;
      outline: none;
    }

    .sealed-name:hover::after,
    .sealed-name:focus-visible::after {
      background: rgba(70, 78, 102, 0.28);
      transform: scaleX(1.02);
      opacity: 1;
    }

    .name-whisper {
      display: block;
      position: relative;
      left: 50%;
      margin: 14px 0 0;
      transform: translate(-50%, 6px);
      width: max-content;
      max-width: min(90vw, 420px);
      min-height: 18px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: rgba(70, 78, 102, 0.88);
      font-size: clamp(9px, 0.92vw, 11px);
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.45;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      filter: blur(2px);
      pointer-events: none;
      z-index: 3;
      transition:
        opacity 0.26s var(--ease-out),
        transform 0.38s var(--ease-out),
        filter 0.38s var(--ease-out);
    }

    .name-whisper::after {
      content: none;
    }

    .name-whisper.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translate(-50%, 0);
    }

    .b-inner {
      padding: 28px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .b-ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 112px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: rgba(0, 0, 0, 0.042);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .b-oath {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.96;
      color: rgb(172, 172, 172);
      max-height: 350px;
      display: block;
      position: relative;
      z-index: 1;
      text-wrap: pretty;
      touch-action: none;
    }

    .oath-char {
      display: inline-block;
      color: rgb(172, 172, 172);
      transition: color 0.22s linear;
    }

    .oath-char.is-space {
      width: 0.55em;
    }

    .b-footer {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--ink-soft);
    }

    .b-org-text {
      writing-mode: vertical-rl;
      font-size: 7.5px;
      font-weight: 600;
      letter-spacing: 0.46em;
      white-space: nowrap;
    }

    .site-credit {
      position: fixed;
      left: 50%;
      bottom: max(env(safe-area-inset-bottom), 4px);
      transform: translateX(-50%);
      z-index: 50;
      font-size: 8px;
      line-height: 1.35;
      letter-spacing: 0.12em;
      color: rgba(0, 0, 0, 0.20);
      text-align: center;
      white-space: nowrap;
      padding: 0 12px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.82s var(--ease-out);
    }

    html.spoiler-active .page-frame,
    html.spoiler-active .site-credit {
      opacity: 0;
      pointer-events: none;
    }

    html.spoiler-active .page-frame {
      transform: scale(0.985);
    }

    html.spoiler-entering .page-frame {
      animation: spoilerRevealPage 0.82s var(--ease-out) forwards;
    }

    html.spoiler-entering .site-credit {
      animation: spoilerRevealCredit 0.82s var(--ease-out) forwards;
    }

    @keyframes spoilerRevealPage {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes spoilerRevealCredit {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .spoiler-overlay {
      position: fixed;
      inset: 0;
      z-index: 190;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(26px, 6vw, 72px);
      background: rgba(242, 242, 243, 0.98);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: background 0.84s ease, opacity 0.84s ease, visibility 0s linear 0.84s;
      cursor: default;
    }

  <script>
    (() => {
      const overlay = document.getElementById('spoiler-overlay');
      const shell = document.getElementById('spoiler-shell');
      let readyToEnter = false;
      let entering = false;

      if (!overlay || !shell) {
        document.documentElement.classList.remove('spoiler-active');
        return;
      }

      function markComplete() {
        overlay.hidden = true;
        document.documentElement.classList.remove('spoiler-active', 'spoiler-entering');
        document.documentElement.classList.add('spoiler-complete');
        entering = false;
      }

      function enterPage() {
        if (!readyToEnter || entering) {
          return;
        }
        entering = true;

        shell.blur();
        overlay.classList.add('is-dismissed');
        overlay.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('spoiler-active');
        document.documentElement.classList.add('spoiler-entering');
        window.setTimeout(markComplete, 860);
      }


      document.documentElement.classList.add('spoiler-active');
      overlay.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => {
        readyToEnter = true;
        overlay.classList.add('is-enterable');
        shell.setAttribute('aria-disabled', 'false');
        shell.tabIndex = 0;
        try {
          shell.focus({ preventScroll: true });
        } catch (error) {
          shell.focus();
        }
      }, 1850);

      overlay.addEventListener('click', enterPage);
      shell.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          enterPage();
        }
      });
    })();
  </script>

      function normalizePassword(value) {
        return value.trim().replace(/\s+/g, ' ').toLowerCase();
      }
      function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      async function deriveLockedArchiveKey(password, salt) {
        const passwordBytes = new TextEncoder().encode(normalizePassword(password));
        const keyMaterial = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: LOCKED_ARCHIVE_ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      }

      async function openLockedArchive(card, password) {
        const archive = LOCKED_ARCHIVES[card.id];
        if (!archive) {
          throw new Error('Missing locked archive.');
        }

        const key = await deriveLockedArchiveKey(password, base64ToBytes(archive.salt));
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: base64ToBytes(archive.iv) },
          key,
          base64ToBytes(archive.data)
        );
        return JSON.parse(new TextDecoder().decode(decrypted));
      }

      async function unlockCardWithPassword(card, password) {
        const unlocked = await openLockedArchive(card, password);
        if (!unlocked || !unlocked.card || typeof unlocked.card !== 'object') {
          throw new Error('Invalid locked archive.');
        }

        Object.assign(card, unlocked.card);
        delete card.locked;
        if (unlocked.story) {
          archiveMemo.set(unlocked.story.id || card.storyId || card.id, unlocked.story);
        }
        unlockedCardIds.add(card.id);
        return card;
      }

      function makeArchiveSalt(storyId) {
        return `${storyId}|kanekoe|staffcard|record`;
      }

      function openArchiveRecord(payload, storyId) {
        const binary = atob(payload);
        const key = makeArchiveSalt(storyId);
        const decoded = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          decoded[index] = binary.charCodeAt(index) ^ ((key.charCodeAt(index % key.length) + index * 17) & 0xff);
        }

        return JSON.parse(new TextDecoder().decode(decoded));
      }

      function normalizeStoryAlign(value) {
        return value === 'center' || value === 'right' ? value : 'left';
      }

      function normalizeStoryRun(run) {
        if (!run || typeof run !== 'object' || Array.isArray(run)) {
          return { text: '' };
        }

        const next = {
          text: typeof run.text === 'string' ? run.text : ''
        };

        if (run.bold === true) {
          next.bold = true;
        }

        if (typeof run.color === 'string' && run.color.trim()) {
          next.color = run.color.trim();
        }

        return next;
      }

      function normalizeStoryParagraph(paragraph) {
        if (typeof paragraph === 'string') {
          return {
            align: 'left',
            runs: [{ text: paragraph }]
          };
        }

        if (!paragraph || typeof paragraph !== 'object' || Array.isArray(paragraph)) {
          return {
            align: 'left',
            runs: [{ text: '' }]
          };
        }

        const runs = Array.isArray(paragraph.runs)
          ? paragraph.runs.map(normalizeStoryRun)
          : [{ text: '' }];

        return {
          align: normalizeStoryAlign(paragraph.align),
          runs
        };
      }

      function normalizeStoryEntry(story, storyId) {
        if (!story || typeof story !== 'object' || Array.isArray(story)) {
          return null;
        }

        return {
          id: typeof story.id === 'string' && story.id.trim() ? story.id.trim() : storyId,
          title: typeof story.title === 'string' ? story.title : '',
          paragraphs: Array.isArray(story.paragraphs)
            ? story.paragraphs.map(normalizeStoryParagraph)
            : []
        };
      }

      function decodeStory(storyId) {
        if (archiveMemo.has(storyId)) {
          return archiveMemo.get(storyId);
        }

        const payload = ARCHIVE_INDEX[storyId];
        if (!payload) {
          return null;
        }

        try {
          const story = normalizeStoryEntry(openArchiveRecord(payload, storyId), storyId);
          archiveMemo.set(storyId, story);
          return story;
        } catch (error) {
          console.warn(`?⊥?閫????鞈?嚗?{storyId}`, error);
          return null;
        }
      }

          cardTiltEl.style.transform = `rotateX(${currentRx.toFixed(3)}deg) rotateY(${currentRy.toFixed(3)}deg)`;

          if (Math.abs(targetRx - currentRx) > 0.05 || Math.abs(targetRy - currentRy) > 0.05) {
            scheduleTilt();
          }
        });
      }

            currentRy = 0;

          return;

        cardTiltEl.style.transform = '';

      function buildOathChars(text) {
        oathDisplayEl.innerHTML = '';
        oathChars = [];

        Array.from(text).forEach(char => {
          if (char === '\r') {
            return;

          if (char === '\n') {
            oathDisplayEl.appendChild(document.createElement('br'));
            return;

          const span = document.createElement('span');
          span.className = 'oath-char';
          if (char === ' ') {
            span.classList.add('is-space');
            span.innerHTML = '&nbsp;';
          } else {
            span.textContent = char;
          }
          oathDisplayEl.appendChild(span);
          oathChars.push(span);
        });

        cacheOathRects();
      }

      function cacheOathRects() {
        pointerRects = oathChars.map(el => ({

          rect: el.getBoundingClientRect()

      function clearOathPaint() {
        oathChars.forEach(el => {
          el.style.color = `rgb(${BASE_OATH_RGB.join(',')})`;

      }

      function paintOathFromPoint(clientX, clientY) {
        if (!isFlipped || !oathChars.length) {
          return;
        }

        if (!pointerRects.length) {
          cacheOathRects();
        }

        pointerRects.forEach(({ el, rect }) => {
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dist = Math.sqrt((clientX - cx) ** 2 + (clientY - cy) ** 2);
          const range = Math.max(rect.width, rect.height) * 2.4;
          const t = Math.max(0, 1 - dist / range);
          const smooth = t * t * (3 - 2 * t);
          const r = Math.round(BASE_OATH_RGB[0] + smooth * (HOVER_OATH_RGB[0] - BASE_OATH_RGB[0]));
          const g = Math.round(BASE_OATH_RGB[1] + smooth * (HOVER_OATH_RGB[1] - BASE_OATH_RGB[1]));
          const b = Math.round(BASE_OATH_RGB[2] + smooth * (HOVER_OATH_RGB[2] - BASE_OATH_RGB[2]));
          el.style.color = `rgb(${r},${g},${b})`;
        });
      }

      function setFlipped(nextFlipped) {
        if (nextFlipped && (isStoryOpen || isStoryAnimating)) {

        isFlipped = nextFlipped;
        cardFlipEl.classList.toggle('is-flipped', nextFlipped);
        if (!nextFlipped) {
          clearOathPaint();
        } else {
          requestAnimationFrame(cacheOathRects);
        }
      }

      async function openStoryPanel(card = currentCard) {
        if (!card || isSwitching || isStoryAnimating || isModalOpen()) {
          return;

        if (!canOpenStory(card)) {
          showUnlockModal(card);
          return;

        if (isStoryOpen && activeStoryCardId === card.id) {
          storyCloseButtonEl.focus();
          return;

        hideWhisper();
        resetTilt(true);

        if (isFlipped) {
          isFlipAnimating = true;
          setFlipped(false);
          await wait(STORY_FLIP_DELAY);
          isFlipAnimating = false;
        }

        renderStoryContent(card);
        activeStoryCardId = card.id;
        isStoryOpen = true;
        isStoryAnimating = true;

        requestAnimationFrame(() => {
          viewerWorkspaceEl.classList.add('is-story-open');
        });

        await wait(STORY_TRANSITION_DURATION);
        isStoryAnimating = false;
        storyCloseButtonEl.focus();

        const { restoreFocus = false } = options;

        if (!isStoryOpen || isStoryAnimating) {

        hideWhisper();
        isStoryAnimating = true;
        viewerWorkspaceEl.classList.remove('is-story-open');
        storyPanelShellEl.setAttribute('aria-hidden', 'true');
        storyCloseButtonEl.disabled = true;

        await wait(STORY_TRANSITION_DURATION);
        isStoryAnimating = false;
        isStoryOpen = false;
        activeStoryCardId = null;
        clearStoryContent();

        if (restoreFocus) {
          photoFrameEl.focus();
        }

        if (isSwitching || isStoryAnimating) {
          return;

        if (isStoryOpen) {
          await closeStoryPanel();
        }

        isSwitching = true;
        viewerCardShellEl.classList.add('is-transitioning');
        hideWhisper();
        resetTilt(false);
        setFlipped(false);

        await viewerCardShellEl.animate(
          [
            { opacity: 1, transform: 'translateX(0) scale(1)' },
            { opacity: 0, transform: 'translateX(18px) scale(0.986)' }
          ],
          {
            duration: SWITCH_DURATION,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          }
        ).finished;

        currentCardId = targetCard.id;
        renderCard(targetCard);
        renderMenu();

        viewerCardShellEl.animate(
          [
            { opacity: 0, transform: 'translateX(-18px) scale(0.986)' },
            { opacity: 1, transform: 'translateX(0) scale(1)' }
          ],
          {
            duration: SWITCH_DURATION,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          }
        );

        window.setTimeout(() => {
          viewerCardShellEl.classList.remove('is-transitioning');
          viewerCardShellEl.style.opacity = '';
          viewerCardShellEl.style.transform = '';
          isSwitching = false;
          cacheOathRects();
        }, SWITCH_DURATION);
      }

      function handleMenuSelection(cardId, menuButton) {
        const targetCard = getCardById(cardId);
        if (!targetCard || isSwitching || isStoryAnimating) {
          return;
        }

        lastFocusedMenuButton = menuButton;

        if (targetCard.locked && !isCardUnlocked(targetCard)) {
          hideWhisper();
          showUnlockModal(targetCard);
          return;
        }

        if (targetCard.id === currentCardId) {
          return;

        animateSwitch(targetCard);

        unlockInputEl.classList.remove('is-error');
        activeModalCardId = null;

        if (restoreFocus && lastFocusedMenuButton) {
          lastFocusedMenuButton.focus();
        }

      async function tryUnlock() {
        if (!activeModalCardId || isUnlockingLockedArchive) {
          return;
        }

        const card = getCardById(activeModalCardId);
        if (!card) {
          return;
        }

        isUnlockingLockedArchive = true;
        unlockInputEl.disabled = true;

        try {
          await unlockCardWithPassword(card, unlockInputEl.value);
          renderMenu();
          hideUnlockModal(false);
          animateSwitch(card);
          return;
        } catch (error) {
          unlockInputEl.classList.remove('is-error');
          void unlockInputEl.offsetWidth;
          unlockInputEl.classList.add('is-error');
          window.setTimeout(() => {
            unlockInputEl.classList.remove('is-error');
            unlockInputEl.select();
          }, 420);
        } finally {
          isUnlockingLockedArchive = false;
          unlockInputEl.disabled = false;
        }
      }

      function initFlipAndTilt() {
        cardFlipEl.addEventListener('click', event => {
          if (event.target.closest('[data-no-flip]') || isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          isFlipAnimating = true;
          setFlipped(!isFlipped);
          resetTilt(false);
          cardFlipEl.addEventListener('transitionend', () => {
            isFlipAnimating = false;
          }, { once: true });
        });

        cardSceneEl.addEventListener('mousemove', event => {
          if (isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          const rect = cardSceneEl.getBoundingClientRect();
          const nx = (event.clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
          const ny = (event.clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
          targetRx = -ny * 7.4;
          targetRy = nx * (isFlipped ? -7.4 : 7.4);
          scheduleTilt();
        });

        cardSceneEl.addEventListener('mouseleave', () => {
          if (isStoryOpen || isStoryAnimating) {
            resetTilt(false);
            return;
          }
          resetTilt(true);
        });

        cardSceneEl.addEventListener('touchstart', event => {
          touchStartedOnNoFlip = Boolean(event.target.closest('[data-no-flip]'));
          touchStartX = event.touches[0].clientX;
          touchStartY = event.touches[0].clientY;
        }, { passive: true });

        cardSceneEl.addEventListener('touchend', event => {
          if (touchStartedOnNoFlip || isFlipAnimating || isCardMotionLocked()) {
            touchStartedOnNoFlip = false;
            return;
          }

          const dx = event.changedTouches[0].clientX - touchStartX;
          const dy = event.changedTouches[0].clientY - touchStartY;
          touchStartedOnNoFlip = false;

          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            cardFlipEl.click();
          }
        }, { passive: true });
      }

      function initOathPainting() {
        cardFlipEl.addEventListener('pointermove', event => {
          paintOathFromPoint(event.clientX, event.clientY);
        });

        cardFlipEl.addEventListener('pointerleave', () => {
          clearOathPaint();
        });

        cardFlipEl.addEventListener('touchstart', event => {
          if (!isFlipped) {
            return;
          }
          const touch = event.touches[0];
          if (!touch) {
            return;
          }
          cacheOathRects();
          paintOathFromPoint(touch.clientX, touch.clientY);
        }, { passive: true });

        cardFlipEl.addEventListener('touchmove', event => {
          if (!isFlipped) {
            return;
          }
          const touch = event.touches[0];
          if (!touch) {
            return;
          }
          paintOathFromPoint(touch.clientX, touch.clientY);
        }, { passive: true });

        cardFlipEl.addEventListener('touchend', () => {
          clearOathPaint();
        }, { passive: true });
      }

      photoFrameEl.addEventListener('click', () => {
        openStoryPanel(currentCard);
      });

      storyCloseButtonEl.addEventListener('click', () => {
        closeStoryPanel({ restoreFocus: true });
      });

      sealedNameButtonEl.addEventListener('click', showWhisper);
      sealedNameButtonEl.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          showWhisper();
        }
      });

      unlockOverlayEl.addEventListener('click', event => {
        if (event.target === unlockOverlayEl) {
          hideUnlockModal();
        }
      });

      unlockInputEl.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          tryUnlock();
        } else if (event.key === 'Escape') {
          hideUnlockModal();
        }
      });

      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') {
          return;
        }

        if (unlockOverlayEl.classList.contains('is-visible')) {
          hideUnlockModal();
          return;
        }

        if (isStoryOpen && !isStoryAnimating) {
          closeStoryPanel({ restoreFocus: true });
          return;
        }

        hideWhisper();
      });

      window.addEventListener('resize', () => {
        cacheOathRects();
      });

      if ('ResizeObserver' in window) {
        new ResizeObserver(cacheOathRects).observe(cardSceneEl);
      }

      clearStoryContent();
      initFlipAndTilt();
      initOathPainting();
      renderCard(currentCard);
      renderMenu();
      clearOathPaint();
    })();
  </script>
