  <style>

    :root {
      --font: 'Noto Serif TC', 'Songti TC', 'SimSun', serif;
      --page-bg: #cbc7be;
      --card-bg: #ffffff;
      --ink: #000000;
      --ink-muted: rgba(0, 0, 0, 0.44);
      --ink-soft: rgba(0, 0, 0, 0.28);
      --ink-faint: rgba(0, 0, 0, 0.14);
      --ghost: rgba(0, 0, 0, 0.045);
      --menu-base: rgba(0, 0, 0, 0.38);
      --menu-line: rgba(0, 0, 0, 0.12);
      --accent: #464e66;
      --shadow-soft: 0 20px 48px rgba(82, 72, 54, 0.10);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --card-w: 295px;
      --card-h: calc(var(--card-w) * 1.531);
      --story-panel-w: min(360px, 38vw);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--page-bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: clamp(22px, 4vw, 44px);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    button,
    input {
      font: inherit;
    }

    body,
    body * {
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    input,
    textarea,
    select,
    [contenteditable],
    [contenteditable] * {
      user-select: text !important;
      -webkit-user-select: text !important;
      -webkit-touch-callout: default !important;
    }

    .page-frame {
      width: min(1120px, 100%);
      min-height: calc(100dvh - clamp(44px, 8vw, 88px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3vw, 34px);
    }

    .page-heading {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 12px;
      padding-inline: clamp(2px, 0.6vw, 8px);
    }

    .heading-main {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .page-kicker {
      font-size: clamp(10px, 0.92vw, 13px);
      letter-spacing: 0.58em;
      color: rgba(0, 0, 0, 0.32);
      white-space: nowrap;
    }

    .page-title {
      font-size: clamp(18px, 1.8vw, 28px);
      letter-spacing: 0.68em;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .staff-shell {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: clamp(28px, 4vw, 54px);
      align-items: start;
    }

    .staff-menu-panel {
      border-right: 1px solid var(--menu-line);
      padding-right: clamp(12px, 1.6vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    .menu-title {
      font-size: 12px;
      letter-spacing: 0.52em;
      color: rgba(0, 0, 0, 0.28);
      white-space: nowrap;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      position: relative;
      border: none;
      background: none;
      padding: 12px 18px 12px 0;
      text-align: left;
      color: var(--menu-base);
      cursor: pointer;
      font-size: clamp(14px, 1.12vw, 18px);
      letter-spacing: 0.58em;
      transition:
        color 0.28s var(--ease-out),
        transform 0.28s var(--ease-out),
        opacity 0.28s var(--ease-out);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      transform: translateY(-50%) scale(0.72);
      transition:
        opacity 0.28s var(--ease-out),
        transform 0.28s var(--ease-out);
      opacity: 0;
    }

    .menu-item::after {
      display: none;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      color: var(--accent);
      transform: translateX(6px);
      outline: none;
    }

    .menu-item:hover::before,
    .menu-item:focus-visible::before {
      opacity: 0.75;
      transform: translateY(-50%) scale(1);
    }

    .menu-item.is-active {
      color: var(--accent);
      transform: translateX(8px);
    }

    .menu-item.is-active::before {
      opacity: 0.9;
      transform: translateY(-50%) scale(1);
    }

    .menu-item.is-active::after {
      display: none;
    }

    .menu-item.is-locked {
      color: rgba(0, 0, 0, 0.26);
    }

    .menu-item.is-locked:hover,
    .menu-item.is-locked:focus-visible {
      color: var(--accent);
    }

    .menu-item-label {
      display: inline-block;
      padding-left: 40px;
    }

    .viewer-panel {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
    }

    .viewer-workspace {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      column-gap: 0;
      row-gap: 0;
      transition: column-gap 0.56s var(--ease-out), row-gap 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open {
      column-gap: clamp(18px, 2.8vw, 34px);
    }

    .viewer-stage {
      width: var(--card-w);
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 1300px;
      min-width: 0;
    }

    .viewer-card-shell {
      width: min(100%, var(--card-w));
      transform-origin: center top;
      transition: opacity 0.3s var(--ease-out), transform 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open .viewer-card-shell {
      transform: translateX(-18px) scale(0.936);
    }

    .viewer-card-shell.is-transitioning {
      pointer-events: none;
    }

    .story-panel-shell {
      width: 0;
      flex: 0 0 auto;
      overflow: hidden;
      opacity: 0;
      transform: translateX(28px);
      pointer-events: none;
      transition:
        width 0.56s var(--ease-out),
        opacity 0.34s var(--ease-out),
        transform 0.56s var(--ease-out);
    }

    .viewer-workspace.is-story-open .story-panel-shell {
      width: var(--story-panel-w);
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .story-panel {
      width: var(--story-panel-w);
      height: calc(var(--card-h) - 2px);
      padding: 22px 22px 18px;
      border: 1px solid rgba(0, 0, 0, 0.10);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(250, 250, 250, 0.93)),
        rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
    }

    .story-panel-header {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      text-align: right;
    }

    .story-panel-kicker {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.48em;
      color: rgba(70, 78, 102, 0.54);
      white-space: nowrap;
      text-align: right;
    }

    .story-panel-title {
      width: 100%;
      font-size: clamp(18px, 1.5vw, 22px);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(28, 31, 39, 0.92);
      line-height: 1.35;
      text-align: right;
    }

    .story-panel-copy {
      overflow-y: auto;
      padding-right: 8px;
      color: rgba(38, 38, 38, 0.82);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.9;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: contain;
    }

    .story-panel-copy p + p {
      margin-top: 14px;
    }

    .story-panel-copy::-webkit-scrollbar {
      width: 6px;
    }

    .story-panel-copy::-webkit-scrollbar-thumb {
      background: rgba(70, 78, 102, 0.18);
      border-radius: 999px;
    }

    .story-panel-copy::-webkit-scrollbar-track {
      background: transparent;
    }

    .story-close-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-self: flex-start;
      border: none;
      background: none;
      color: rgba(70, 78, 102, 0.86);
      cursor: pointer;
      padding: 0 0 2px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.34em;
      transition: color 0.28s var(--ease-out), transform 0.28s var(--ease-out), opacity 0.28s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .story-close-button::before {
      content: '';
      width: 18px;
      height: 1px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .story-close-button:hover,
    .story-close-button:focus-visible {
      color: var(--accent);
      transform: translateX(-2px);
      outline: none;
    }

    .story-close-button:disabled {
      opacity: 0;
      pointer-events: none;
    }

    .card-scene {
      width: min(100%, var(--card-w));
      height: var(--card-h);
      perspective: 1100px;
      margin: 0 auto;
    }

    .card-tilt {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card-tilt.spring-back {
      transition: transform 0.64s var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      .card-tilt.spring-back {
        transition: none;
      }
    }

    @media (max-width: 1080px) {
      .card-scene {
        touch-action: pan-y;
      }
    }

    .card-flip {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.82s var(--ease-out);
      cursor: pointer;
      will-change: transform;
    }

    .card-flip.is-flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      border: 1px solid var(--ink-faint);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .face.back {
      transform: rotateY(180deg);
    }

    .card-caption {
      display: none;
    }

    .f-inner,
    .b-inner {
      width: 100%;
      height: 100%;
      position: relative;
      background: var(--card-bg);
    }

    .f-inner {
      padding: clamp(24px, 5.5%, 34px) clamp(26px, 5.8%, 34px) clamp(24px, 5%, 30px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }

    .f-header {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 18px);
      min-height: 42px;
    }

    .f-seal {
      flex: 0 0 auto;
      display: block;
    }

    .f-org {
      font-size: clamp(12px, 1.34vw, 16px);
      font-weight: 700;
      letter-spacing: 0.74em;
      line-height: 1;
      white-space: nowrap;
    }

    .f-rule {
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.14);
      margin-top: clamp(22px, 4.4%, 30px);
    }

    .f-media {
      display: flex;
      align-items: flex-start;
      padding-top: clamp(24px, 4.8%, 30px);
      min-height: 0;
    }

    .f-photo {
      appearance: none;
      display: block;
      width: 58.6%;
      aspect-ratio: 148 / 190;
      border: 1px solid rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
      padding: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(252, 252, 252, 0.98)),
        repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.025) 0,
          rgba(0, 0, 0, 0.025) 1px,
          transparent 1px,
          transparent 54px
        );
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68);
      cursor: pointer;
      z-index: 1;
      transition:
        transform 0.44s var(--ease-out),
        box-shadow 0.44s var(--ease-out),
        border-color 0.28s var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .f-photo.is-empty::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(0, 0, 0, 0.02));
      pointer-events: none;
    }

    .f-photo:hover,
    .f-photo:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(70, 78, 102, 0.26);
      box-shadow:
        0 16px 26px rgba(72, 76, 93, 0.10),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      outline: none;
    }

    .f-photo:disabled {
      cursor: default;
      transform: none;
      border-color: rgba(0, 0, 0, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68);
    }

    .f-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .f-photo-hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: inline-flex;
      align-items: center;
      padding: 4px 8px 4px 10px;
      border: 1px solid rgba(70, 78, 102, 0.12);
      background: rgba(255, 255, 255, 0.86);
      color: rgba(70, 78, 102, 0.78);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.34em;
      line-height: 1;
      pointer-events: none;
      z-index: 2;
      opacity: 0.76;
      transform: translateY(3px);
      transition: opacity 0.28s var(--ease-out), transform 0.28s var(--ease-out), color 0.28s var(--ease-out);
    }

    .f-photo:hover .f-photo-hint,
    .f-photo:focus-visible .f-photo-hint {
      opacity: 1;
      transform: translateY(0);
      color: var(--accent);
    }

    .f-photo:disabled .f-photo-hint {
      opacity: 0.82;
      color: rgba(82, 82, 82, 0.58);
      background: rgba(244, 244, 244, 0.88);
    }

    .f-watermark {
      position: absolute;
      top: clamp(104px, 23.5%, 118px);
      right: clamp(6px, 1.4vw, 12px);
      bottom: clamp(34px, 8%, 42px);
      writing-mode: vertical-rl;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(76px, 8vw, 84px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: rgba(0, 0, 0, 0.048);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      transform: translateX(-4px);
      z-index: 0;
    }

    .f-watermark[data-type="歸屬證"] {
      right: clamp(4px, 1.2vw, 10px);
    }

    .f-info {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vw, 12px);
      padding-top: clamp(10px, 2%, 16px);
      z-index: 1;
    }

    .f-row {
      display: flex;
      align-items: baseline;
      gap: 0;
      font-size: clamp(14px, 1.38vw, 19px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.55;
      color: var(--ink);
      white-space: nowrap;
    }

    .f-lbl {
      flex: 0 0 3.7em;
      color: var(--ink-muted);
      letter-spacing: 0.14em;
      min-width: 0;
    }

    #name-display,
    #role-display {
      display: block;
      min-width: 0;
    }

    .sealed-name {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      border: none;
      background: none;
      color: #000000;
      cursor: pointer;
      padding: 0;
      letter-spacing: 0;
      font-size: inherit;
      line-height: inherit;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .name-row {
      position: relative;
    }

    .sealed-name::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.12em;
      height: 1px;
      background: rgba(0, 0, 0, 0.16);
      transform: scaleX(1);
      transform-origin: center;
      opacity: 1;
      transition: transform 0.28s var(--ease-out), opacity 0.28s var(--ease-out);
    }

    .sealed-name:hover,
    .sealed-name:focus-visible {
      color: #000000;
      outline: none;
    }

    .sealed-name:hover::after,
    .sealed-name:focus-visible::after {
      background: rgba(70, 78, 102, 0.28);
      transform: scaleX(1.02);
      opacity: 1;
    }

    .name-whisper {
      display: block;
      position: relative;
      left: 50%;
      margin: 14px 0 0;
      transform: translate(-50%, 6px);
      width: max-content;
      max-width: min(90vw, 420px);
      min-height: 18px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: rgba(70, 78, 102, 0.88);
      font-size: clamp(9px, 0.92vw, 11px);
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.45;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      filter: blur(2px);
      pointer-events: none;
      z-index: 3;
      transition:
        opacity 0.26s var(--ease-out),
        transform 0.38s var(--ease-out),
        filter 0.38s var(--ease-out);
    }

    .name-whisper::after {
      content: none;
    }

    .name-whisper.is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translate(-50%, 0);
    }

    .b-inner {
      padding: 28px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .b-ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 112px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: rgba(0, 0, 0, 0.042);
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .b-oath {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.62;
      color: rgb(172, 172, 172);
      height: auto;
      display: inline-flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      justify-content: center;
      gap: 0.34em;
      position: relative;
      z-index: 1;
      text-wrap: pretty;
      touch-action: none;
    }

    .oath-line {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: block;
      height: auto;
      line-height: inherit;
      text-align: start;
      white-space: nowrap;
    }

    .oath-char {
      display: inline-block;
      color: rgb(172, 172, 172);
      transition: color 0.32s ease-out, opacity 0.32s ease-out;
    }

    .oath-char.is-space {
      width: 0.55em;
      height: 0.55em;
    }

    .b-footer {

  <script>
    (() => {
      const overlay = document.getElementById('protection-overlay');
      const messageEl = document.getElementById('protection-message');
      let hideTimer = 0;
      let scrubTimer = 0;

      if (!overlay || !messageEl) {
        return;
      }

      function hideNotice() {
        window.clearTimeout(hideTimer);
        overlay.classList.remove('is-visible');
        overlay.setAttribute('aria-hidden', 'true');
      }

      function showNotice(message, duration = 1800) {
        window.clearTimeout(hideTimer);
        messageEl.textContent = message;
        overlay.classList.add('is-visible');
        overlay.setAttribute('aria-hidden', 'false');
        hideTimer = window.setTimeout(hideNotice, duration);
      }

      function scrubScreen(message = '畫面暫時遮蔽。') {
        window.clearTimeout(scrubTimer);
        document.documentElement.classList.add('protection-scrub');
        showNotice(message, 1800);
        scrubTimer = window.setTimeout(() => {
          document.documentElement.classList.remove('protection-scrub');
        }, 1800);
      }

      function isBlockedShortcut(event) {
        const key = String(event.key || '').toLowerCase();
        const code = String(event.code || '').toLowerCase();
        const hasPrimary = event.ctrlKey || event.metaKey;
        const isPrintScreen = key === 'printscreen' || code === 'printscreen';
        const isF12 = key === 'f12' || code === 'f12';
        const isDeveloperChord = hasPrimary && event.shiftKey && ['i', 'j', 'c'].includes(key);
        const isMacDeveloperChord = event.metaKey && event.altKey && ['i', 'j', 'c'].includes(key);
        const isSourceView = hasPrimary && key === 'u';
        const isClipboardChord = hasPrimary && ['c', 'x'].includes(key);
        const isSelectAll = hasPrimary && key === 'a';

        if (isPrintScreen) {
          return 'printscreen';
        }

        if (isF12 || isDeveloperChord || isMacDeveloperChord || isSourceView) {
          return 'developer';
        }

        if (isClipboardChord) {
          return 'clipboard';
        }

        if (isSelectAll) {
          return 'selection';
        }

        return false;
      }

      function getEventElement(target) {
        if (target instanceof Element) {
          return target;
        }

        return target?.parentElement instanceof Element ? target.parentElement : null;
      }

      function isEditableTarget(target) {
        const element = getEventElement(target);
        if (!element) {
          return false;
        }

        const editable = element.closest('input, textarea, select, [contenteditable]');
        return Boolean(editable && (
          editable.matches('input, textarea, select') ||
          editable.isContentEditable
        ));
      }

      function clearProtectedSelection() {
        if (isEditableTarget(document.activeElement)) {
          return;
        }

        const selection = window.getSelection ? window.getSelection() : null;
        if (!selection || selection.isCollapsed) {
          return;
        }

        if (isEditableTarget(selection.anchorNode) || isEditableTarget(selection.focusNode)) {
          return;
        }

        selection.removeAllRanges();
      }

      function blockClipboardEvent(event) {
        if (isEditableTarget(event.target)) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        if (event.clipboardData) {
          event.clipboardData.clearData();
        }
        clearProtectedSelection();
        showNotice('\u6b64\u9801\u6587\u5b57\u5df2\u53d7\u4fdd\u8b77\u3002', 1300);
      }

      document.addEventListener('contextmenu', event => {
        event.preventDefault();
        showNotice('此頁已關閉右鍵選單。', 1300);
      });

      document.addEventListener('selectstart', event => {
        if (isEditableTarget(event.target)) {
          return;
        }

        event.preventDefault();
      }, true);

      document.addEventListener('copy', blockClipboardEvent, true);
      document.addEventListener('cut', blockClipboardEvent, true);

      document.addEventListener('selectionchange', () => {
        window.requestAnimationFrame(clearProtectedSelection);
      });

      document.addEventListener('keydown', event => {
        const blocked = isBlockedShortcut(event);
        if (!blocked || isEditableTarget(event.target)) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        if (blocked === 'printscreen') {
          scrubScreen();
          return;
        }

        if (blocked === 'clipboard' || blocked === 'selection') {
          clearProtectedSelection();
          showNotice('\u6b64\u9801\u6587\u5b57\u5df2\u53d7\u4fdd\u8b77\u3002', 1300);
          return;
        }

        showNotice('請關閉開發者工具後返回。', 2200);
      }, true);

      document.addEventListener('keyup', event => {
        const key = String(event.key || '').toLowerCase();
        const code = String(event.code || '').toLowerCase();
        if (key === 'printscreen' || code === 'printscreen') {
          scrubScreen();
        }
      }, true);

      overlay.addEventListener('click', hideNotice);
    })();
  </script>
  <script>
    (() => {
      const overlay = document.getElementById('spoiler-overlay');
      const shell = document.getElementById('spoiler-shell');
      let readyToEnter = false;
      let entering = false;

      if (!overlay || !shell) {
        document.documentElement.classList.remove('spoiler-active');
        return;
      }

      function markComplete() {
        overlay.hidden = true;
        document.documentElement.classList.remove('spoiler-active', 'spoiler-entering');
        document.documentElement.classList.add('spoiler-complete');
        entering = false;
      }

      function enterPage() {
        if (!readyToEnter || entering) {
          return;
        }
        entering = true;

        shell.blur();
        overlay.classList.add('is-dismissed');
        overlay.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('spoiler-active');
        document.documentElement.classList.add('spoiler-entering');
        window.setTimeout(markComplete, 860);
      }


      document.documentElement.classList.add('spoiler-active');
      overlay.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => {
        readyToEnter = true;
        overlay.classList.add('is-enterable');
        shell.setAttribute('aria-disabled', 'false');
        shell.tabIndex = 0;
        try {
          shell.focus({ preventScroll: true });
        } catch (error) {
          shell.focus();
        }
      }, 1100);

      overlay.addEventListener('click', enterPage);
      shell.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          enterPage();
        }
      });
    })();
  </script>

      async function deriveLockedArchiveKey(password, salt) {
        const passwordBytes = new TextEncoder().encode(normalizePassword(password));
        const keyMaterial = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: LOCKED_ARCHIVE_ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      }

      async function openLockedArchive(card, password) {
        const archive = LOCKED_ARCHIVES[card.id];
        if (!archive) {
          throw new Error('Missing locked archive.');
        }

        const key = await deriveLockedArchiveKey(password, base64ToBytes(archive.salt));
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: base64ToBytes(archive.iv) },
          key,
          base64ToBytes(archive.data)
        );
        return JSON.parse(new TextDecoder().decode(decrypted));
      }

      async function unlockCardWithPassword(card, password) {
        const unlocked = await openLockedArchive(card, password);
        if (!unlocked || !unlocked.card || typeof unlocked.card !== 'object') {
          throw new Error('Invalid locked archive.');
        }

        Object.assign(card, unlocked.card);
        delete card.locked;
        if (unlocked.story) {
          memoStory(unlocked.story, card.storyId || card.id);
        }
        memoStories(unlocked.extraStories);
        applyCardPatches(unlocked.cardPatches);
        unlockedCardIds.add(card.id);
        return card;
      }

      function makeArchiveSalt(storyId) {
        return `${storyId}|kanekoe|staffcard|record`;
      }

      function openArchiveRecord(payload, storyId) {
        const binary = atob(payload);
        const key = makeArchiveSalt(storyId);
        const decoded = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          decoded[index] = binary.charCodeAt(index) ^ ((key.charCodeAt(index % key.length) + index * 17) & 0xff);
        }

        return JSON.parse(new TextDecoder().decode(decoded));
      }

      function normalizeStoryAlign(value) {
        return value === 'center' || value === 'right' ? value : 'left';
      }

      function normalizeStoryLineBreaks(value) {
        return String(value ?? '').replace(/\r\n?/g, '\n');
      }

      function isStoryAsciiWordChar(value) {
        return /^[A-Za-z0-9]$/.test(value || '');
      }

      function storyTextCharBefore(text, index) {
        for (let cursor = index - 1; cursor >= 0; cursor -= 1) {
          if (text[cursor] !== '\n') return text[cursor];
        }
        return '';
      }

      function storyTextCharAfter(text, index) {
        for (let cursor = index; cursor < text.length; cursor += 1) {
          if (text[cursor] !== '\n') return text[cursor];
        }
        return '';
      }

      function storySoftBreakJoiner(text, start, end) {
        const before = storyTextCharBefore(text, start);
        const after = storyTextCharAfter(text, end);
        return isStoryAsciiWordChar(before) && isStoryAsciiWordChar(after) ? ' ' : '';
      }

      function cleanStoryRunText(text, paragraphText, offset) {
        const raw = normalizeStoryLineBreaks(text);
        let cleaned = '';

        for (let index = 0; index < raw.length; index += 1) {
          if (raw[index] !== '\n') {
            cleaned += raw[index];
            continue;
          }

          let end = index + 1;
          while (raw[end] === '\n') end += 1;
          cleaned += storySoftBreakJoiner(paragraphText, offset + index, offset + end);
          index = end - 1;
        }

        return cleaned;
      }

      function storyRunKey(run) {
        return `${run.bold === true ? '1' : '0'}|${run.color || ''}`;
      }

      function pushStoryRun(runs, run) {
        if (!run.text) return;
        const next = { text: run.text };
        if (run.bold === true) next.bold = true;
        if (run.color) next.color = run.color;
        const last = runs[runs.length - 1];
        if (last && storyRunKey(last) === storyRunKey(next)) {
          last.text += next.text;
        } else {
          runs.push(next);
        }
      }

      function normalizeStoryRuns(runs, emptyText = EMPTY_STORY_PARAGRAPH_TEXT, options = {}) {
        const rawRuns = (Array.isArray(runs) ? runs : []).map(run => ({
          text: normalizeStoryLineBreaks(typeof run?.text === 'string' ? run.text : ''),
          bold: run?.bold === true,
          color: typeof run?.color === 'string' && run.color.trim() ? run.color.trim() : ''
        }));
        const paragraphText = rawRuns.map(run => run.text).join('');
        const normalized = [];
        let offset = 0;

        rawRuns.forEach(run => {
          pushStoryRun(normalized, {
            text: options.cleanSoftBreaks ? cleanStoryRunText(run.text, paragraphText, offset) : run.text,
            bold: run.bold,
            color: run.color
          });
          offset += run.text.length;
        });

        if (normalized.map(run => run.text).join('').trim()) return normalized;
        return emptyText ? [{ text: emptyText }] : [];
      }

      function cleanStoryText(value) {
        return normalizeStoryLineBreaks(value);
      }

      function normalizeStoryRun(run) {
        return normalizeStoryRuns([run], '')[0] || { text: '' };
      }

      function normalizeStoryParagraph(paragraph) {
        if (typeof paragraph === 'string') {
          return {
            align: 'left',
            runs: normalizeStoryRuns([{ text: paragraph }])
          };
        }

        if (!paragraph || typeof paragraph !== 'object' || Array.isArray(paragraph)) {
          return {
            align: 'left',
            runs: [{ text: EMPTY_STORY_PARAGRAPH_TEXT }]
          };
        }

        const runs = normalizeStoryRuns(Array.isArray(paragraph.runs)
          ? paragraph.runs
          : [{ text: '' }]);

        return {
          align: normalizeStoryAlign(paragraph.align),
          runs
        };
      }

      function normalizeStoryEntry(story, storyId) {
        if (!story || typeof story !== 'object' || Array.isArray(story)) {
          return null;
        }

        return {
          id: typeof story.id === 'string' && story.id.trim() ? story.id.trim() : storyId,
          title: typeof story.title === 'string' ? story.title : '',
          paragraphs: Array.isArray(story.paragraphs)
            ? story.paragraphs.map(normalizeStoryParagraph)
            : []
        };
      }

      function decodeStory(storyId) {
        if (archiveMemo.has(storyId)) {
          return archiveMemo.get(storyId);
        }

        const payload = ARCHIVE_INDEX[storyId];
        if (!payload) {
          return null;
        }

        try {
          const story = normalizeStoryEntry(openArchiveRecord(payload, storyId), storyId);
          archiveMemo.set(storyId, story);
          return story;
        } catch (error) {
          console.warn(`?⊥?閫????鞈?嚗?{storyId}`, error);
          return null;
        }
      }

      function getCardById(cardId) {
        return staffCards.find(card => card.id === cardId);
      }

      function memoStory(story, fallbackStoryId) {
        const normalized = normalizeStoryEntry(story, fallbackStoryId);
        if (normalized) {
          archiveMemo.set(normalized.id, normalized);
        }
      }

      function memoStories(stories) {
        if (!Array.isArray(stories)) {
          return;
        }

        stories.forEach(story => {
          memoStory(story, story?.id);
        });
      }

      function applyCardPatches(patches) {
        if (!Array.isArray(patches)) {
          return;
        }

        patches.forEach(patch => {
          if (!patch || typeof patch !== 'object' || Array.isArray(patch)) {
            return;
          }

          const target = getCardById(patch.id || patch.cardId);
          if (!target) {
            return;
          }

          if (patch.set && typeof patch.set === 'object' && !Array.isArray(patch.set)) {
            Object.assign(target, patch.set);
          }

          if (Array.isArray(patch.unset)) {
            patch.unset.forEach(field => {
              if (typeof field === 'string') {
                delete target[field];
              }
            });
          }
        });
      }

      function getStoryId(card) {
        return card.storyId || card.id;
      }

      function isCardUnlocked(card) {
        return !card.locked || unlockedCardIds.has(card.id);
      }

      function canOpenStory(card) {
        return Boolean(card) && isCardUnlocked(card);
      }

      function isModalOpen() {
        return activeModalCardId !== null;
      }
      function isMobileViewport() {
        return window.matchMedia('(max-width: 1080px)').matches;
      }

      function prefersReducedMotion() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function isMobileMenuOpen() {
        return Boolean(staffMenuPanelEl && staffMenuPanelEl.classList.contains('is-menu-open'));
      }

      function lockStoryScroll() {
        document.documentElement.classList.add('story-modal-open');

        if (!isMobileViewport()) {
          return;
        }

        storyScrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.style.position = 'fixed';
        document.body.style.top = `-${storyScrollY}px`;
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
        document.body.style.overflow = 'hidden';
      }

      function unlockStoryScroll() {
        document.documentElement.classList.remove('story-modal-open');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        document.body.style.overflow = '';

        if (isMobileViewport()) {
          window.scrollTo(0, storyScrollY);
        }
      }
      function isCardMotionLocked() {
        return isSwitching || isStoryAnimating || isStoryOpen || isModalOpen() || isMobileMenuOpen();
      }

      function getMenuLabel(card) {
        if (card.locked && !isCardUnlocked(card)) {
          return card.menuLabel;
        }
        return card.revealedMenuLabel;
      }


      function setMobileMenuOpen(nextOpen) {
        if (!staffMenuPanelEl || !mobileMenuToggleEl) {
          return;
        }

        staffMenuPanelEl.classList.toggle('is-menu-open', nextOpen);
        mobileMenuToggleEl.setAttribute('aria-expanded', String(nextOpen));
      }

      function syncMobileMenuLabel() {
        if (!mobileMenuCurrentEl || !currentCard) {
          return;
        }

        mobileMenuCurrentEl.textContent = getMenuLabel(currentCard);
      }

      function initMobileMenu() {
        if (!staffMenuPanelEl || mobileMenuToggleEl) {
          return;
        }

        mobileMenuToggleEl = document.createElement('button');
        mobileMenuToggleEl.type = 'button';
        mobileMenuToggleEl.className = 'mobile-menu-toggle';
        mobileMenuToggleEl.setAttribute('aria-controls', 'menu-list');
        mobileMenuToggleEl.setAttribute('aria-expanded', 'false');

        const labelWrap = document.createElement('span');
        const kicker = document.createElement('span');
        kicker.className = 'mobile-menu-kicker';
        kicker.textContent = '\u4eba\u54e1\u4e00\u89bd';
        mobileMenuCurrentEl = document.createElement('span');
        mobileMenuCurrentEl.className = 'mobile-menu-current';

        labelWrap.appendChild(kicker);
        labelWrap.appendChild(mobileMenuCurrentEl);
        mobileMenuToggleEl.appendChild(labelWrap);

        staffMenuPanelEl.insertBefore(mobileMenuToggleEl, menuListEl);

        mobileMenuToggleEl.addEventListener('click', event => {
          event.stopPropagation();
          setMobileMenuOpen(!staffMenuPanelEl.classList.contains('is-menu-open'));
        });

        document.addEventListener('click', event => {
          if (staffMenuPanelEl.contains(event.target)) {
            return;
          }
          setMobileMenuOpen(false);
        });

        syncMobileMenuLabel();
      }
      function scheduleTilt() {
        cancelAnimationFrame(tiltFrame);
        tiltFrame = requestAnimationFrame(() => {
          currentRx += (targetRx - currentRx) * 0.18;
          currentRy += (targetRy - currentRy) * 0.18;
          cardTiltEl.style.transform = `rotateX(${currentRx.toFixed(3)}deg) rotateY(${currentRy.toFixed(3)}deg)`;

          if (Math.abs(targetRx - currentRx) > 0.05 || Math.abs(targetRy - currentRy) > 0.05) {
            scheduleTilt();
          }
        });
      }

      function applyTiltFromPoint(clientX, clientY, strength = DESKTOP_TILT_STRENGTH) {
        const rect = cardSceneEl.getBoundingClientRect();
        if (!rect.width || !rect.height) {
          return;
        }

        const nx = Math.max(-1, Math.min(1, (clientX - (rect.left + rect.width / 2)) / (rect.width / 2)));
        const ny = Math.max(-1, Math.min(1, (clientY - (rect.top + rect.height / 2)) / (rect.height / 2)));
        cardTiltEl.classList.remove('spring-back');
        targetRx = -ny * strength;
        targetRy = nx * (isFlipped ? -strength : strength);
        scheduleTilt();
      }

      function resetTilt(useSpringBack = false) {
        targetRx = 0;
        targetRy = 0;
        cancelAnimationFrame(tiltFrame);

        if (useSpringBack && !prefersReducedMotion()) {
          cardTiltEl.classList.add('spring-back');
          cardTiltEl.style.transform = '';
          cardTiltEl.addEventListener('transitionend', () => {
            cardTiltEl.classList.remove('spring-back');
            currentRx = 0;
            currentRy = 0;
          }, { once: true });
          return;
        }

        cardTiltEl.classList.remove('spring-back');
        cardTiltEl.style.transform = '';
        currentRx = 0;
        currentRy = 0;
      }

      function renderMenu() {
        menuListEl.innerHTML = '';

        staffCards.forEach(card => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'menu-item';
          button.dataset.cardId = card.id;
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', String(card.id === currentCardId));

          if (card.id === currentCardId) {
            button.classList.add('is-active');
          }
          if (card.locked && !isCardUnlocked(card)) {
            button.classList.add('is-locked');
          }

          const span = document.createElement('span');
          span.className = 'menu-item-label';
          span.textContent = getMenuLabel(card);
          button.appendChild(span);

          button.addEventListener('click', () => {
            handleMenuSelection(card.id, button);
          });

          menuListEl.appendChild(button);
        });

        syncMobileMenuLabel();
      }

      function renderPhoto(card) {
        const storyAccessible = canOpenStory(card);

        photoFrameEl.innerHTML = '';
        photoFrameEl.classList.toggle('is-empty', !card.photoSrc);
        photoFrameEl.disabled = !storyAccessible;
        photoFrameEl.setAttribute('aria-disabled', String(!storyAccessible));
        photoFrameEl.setAttribute(
          'aria-label',
          storyAccessible ? `展開 ${card.revealedMenuLabel} 的故事` : `${card.menuLabel} 的故事尚未開啟`
        );

        if (card.photoSrc) {
          const img = document.createElement('img');
          img.src = card.photoSrc;
          img.alt = `${card.revealedMenuLabel} 的職員證照片`;
          photoFrameEl.appendChild(img);
        }

        const hint = document.createElement('span');
        hint.className = 'f-photo-hint';
        hint.textContent = storyAccessible ? STORY_HINT_LABEL : STORY_LOCKED_HINT_LABEL;
        photoFrameEl.appendChild(hint);
      }

      function hideWhisper() {
        window.clearTimeout(whisperTimer);
        nameWhisperEl.classList.remove('is-visible');
        nameWhisperEl.setAttribute('aria-hidden', 'true');
      }

      function showWhisper() {
        if (!currentCard.whisper || isSwitching || isStoryOpen || isStoryAnimating || isModalOpen()) {
          return;
        }

        hideWhisper();
        nameWhisperEl.setAttribute('aria-hidden', 'false');
        void nameWhisperEl.offsetWidth;
        nameWhisperEl.classList.add('is-visible');
        whisperTimer = window.setTimeout(() => {
          hideWhisper();
        }, 2200);
      }

      function renderNameRow(card) {
        hideWhisper();

        if (card.whisper) {
          nameDisplayEl.hidden = true;
          sealedNameButtonEl.hidden = false;
          sealedNameButtonEl.textContent = card.sealedNameButtonLabel || card.name;
          sealedNameButtonEl.setAttribute('aria-label', card.whisperAriaLabel || '查看隱藏名字的心聲');
          nameWhisperEl.textContent = card.whisper;
        } else {
          sealedNameButtonEl.hidden = true;
          sealedNameButtonEl.textContent = '';
          nameWhisperEl.textContent = '';
          nameDisplayEl.hidden = false;
          nameDisplayEl.textContent = card.name;
        }
      }

      function renderStoryContent(card) {
        const story = decodeStory(getStoryId(card));
        const paragraphs = Array.isArray(story?.paragraphs) && story.paragraphs.length
          ? story.paragraphs
          : [{ align: 'left', runs: [{ text: '故事內容尚未建立。' }] }];

        storyTitleEl.textContent = story?.title || card.revealedMenuLabel;
        storyCopyEl.innerHTML = '';
        storyCopyEl.scrollTop = 0;

        paragraphs.forEach(paragraphData => {
          const paragraph = document.createElement('p');
          paragraph.style.textAlign = normalizeStoryAlign(paragraphData.align);

          let hasVisibleText = false;
          paragraphData.runs.forEach(runData => {
            const span = document.createElement('span');
            const text = cleanStoryText(runData.text);
            text.split('\n').forEach((line, i, arr) => {
              span.appendChild(document.createTextNode(line));
              if (i < arr.length - 1) {
                span.appendChild(document.createElement('br'));
              }
            });

            if (runData.bold) {
              span.style.fontWeight = '700';
            }

            if (runData.color) {
              span.style.color = runData.color;
            }

            if (text) {
              hasVisibleText = true;
            }

            paragraph.appendChild(span);
          });

          if (!hasVisibleText) {
            paragraph.appendChild(document.createTextNode(' '));
          }

          storyCopyEl.appendChild(paragraph);
        });

        storyPanelShellEl.setAttribute('aria-hidden', 'false');
        storyCloseButtonEl.disabled = false;
      }

      function clearStoryContent() {
        storyTitleEl.textContent = '';
        storyCopyEl.innerHTML = '';
        storyPanelShellEl.setAttribute('aria-hidden', 'true');
        storyCloseButtonEl.disabled = true;
      }

      function buildOathChars(text) {
        oathDisplayEl.innerHTML = '';
        oathChars = [];

        String(text).replace(/\r/g, '').split('\n').forEach(line => {
          const lineEl = document.createElement('span');
          lineEl.className = 'oath-line';

          Array.from(line).forEach(char => {
            const span = document.createElement('span');
            span.className = 'oath-char';
            if (char === ' ') {
              span.classList.add('is-space');
              span.innerHTML = '&nbsp;';
            } else {
              span.textContent = char;
            }
            lineEl.appendChild(span);
            oathChars.push(span);
          });

          oathDisplayEl.appendChild(lineEl);
        });

        cacheOathRects();
      }

      function renderCard(card) {
        currentCard = card;
        frontWatermarkEl.textContent = card.certificateType;
        frontWatermarkEl.dataset.type = card.certificateType;
        backGhostEl.textContent = card.watermarkText;
        roleDisplayEl.textContent = card.role;
        cardCaptionEl.textContent = card.captionLabel;
        renderPhoto(card);
        renderNameRow(card);
        buildOathChars(card.oath);
        oathDisplayEl.setAttribute('aria-label', card.oath);
        cardSceneEl.setAttribute('aria-label', `${card.revealedMenuLabel} 的職員證`);
      }

      function cacheOathRects() {
        pointerRects = oathChars.map(el => ({
          el,
          rect: el.getBoundingClientRect()
        }));
      }

      function clearOathPaint() {
        if (oathPaintFrame) {
          cancelAnimationFrame(oathPaintFrame);
          oathPaintFrame = 0;
        }
        oathChars.forEach(el => {
          el.style.color = `rgb(${BASE_OATH_RGB.join(',')})`;
          el.style.opacity = '';
        });
      }

      function paintOathFromPoint(clientX, clientY) {
        if (!isFlipped || !oathChars.length) {
          return;
        }

        if (!pointerRects.length) {
          cacheOathRects();
        }

        const range = OATH_PAINT_RADIUS_PX;
        const inv = 1 / range;

        pointerRects.forEach(({ el, rect }) => {
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = clientX - cx;
          const dy = clientY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const t = Math.max(0, 1 - dist * inv);
          // Sharper falloff so the trail feels alive
          const eased = t * t * (3 - 2 * t);
          const r = Math.round(BASE_OATH_RGB[0] + eased * (HOVER_OATH_RGB[0] - BASE_OATH_RGB[0]));
          const g = Math.round(BASE_OATH_RGB[1] + eased * (HOVER_OATH_RGB[1] - BASE_OATH_RGB[1]));
          const b = Math.round(BASE_OATH_RGB[2] + eased * (HOVER_OATH_RGB[2] - BASE_OATH_RGB[2]));
          el.style.color = `rgb(${r},${g},${b})`;
          // Subtle opacity lift on the brightest chars makes the sweep feel tactile
          if (eased > 0.04) {
            el.style.opacity = String(0.78 + eased * 0.22);
          } else if (el.style.opacity) {
            el.style.opacity = '';
          }
        });
      }

      let oathPaintFrame = 0;
      let oathPaintX = 0;
      let oathPaintY = 0;
      function queueOathPaint(clientX, clientY) {
        oathPaintX = clientX;
        oathPaintY = clientY;
        if (oathPaintFrame) {
          return;
        }
        oathPaintFrame = requestAnimationFrame(() => {
          oathPaintFrame = 0;
          paintOathFromPoint(oathPaintX, oathPaintY);
        });
      }

      function setFlipped(nextFlipped) {
        if (nextFlipped && (isStoryOpen || isStoryAnimating)) {
          return;
        }

        isFlipped = nextFlipped;
        cardFlipEl.classList.toggle('is-flipped', nextFlipped);
        if (!nextFlipped) {
          clearOathPaint();
        } else {
          requestAnimationFrame(cacheOathRects);
        }
      }

      async function openStoryPanel(card = currentCard) {
        if (!card || isSwitching || isStoryAnimating || isModalOpen()) {
          return;
        }

        if (!canOpenStory(card)) {
          showUnlockModal(card);
          return;
        }

        if (isStoryOpen && activeStoryCardId === card.id) {
          storyCloseButtonEl.focus();
          return;
        }

        setMobileMenuOpen(false);
        hideWhisper();
        resetTilt(true);

        if (isFlipped) {
          isFlipAnimating = true;
          setFlipped(false);
          await wait(STORY_FLIP_DELAY);
          isFlipAnimating = false;
        }

        renderStoryContent(card);
        activeStoryCardId = card.id;
        isStoryOpen = true;
        isStoryAnimating = true;
        lockStoryScroll();

        requestAnimationFrame(() => {
          viewerWorkspaceEl.classList.add('is-story-open');
        });

        await wait(STORY_TRANSITION_DURATION);
        isStoryAnimating = false;
        storyCloseButtonEl.focus();
      }

      async function closeStoryPanel(options = {}) {
        const { restoreFocus = false } = options;

        if (!isStoryOpen || isStoryAnimating) {
          return;
        }

        hideWhisper();
        isStoryAnimating = true;
        viewerWorkspaceEl.classList.remove('is-story-open');
        storyPanelShellEl.setAttribute('aria-hidden', 'true');
        storyCloseButtonEl.disabled = true;

        await wait(STORY_TRANSITION_DURATION);
        unlockStoryScroll();
        isStoryAnimating = false;
        isStoryOpen = false;
        activeStoryCardId = null;
        clearStoryContent();

        if (restoreFocus) {
          photoFrameEl.focus();
        }
      }

      async function animateSwitch(targetCard) {
        if (isSwitching || isStoryAnimating) {
          return;
        }

        if (isStoryOpen) {
          await closeStoryPanel();
        }

        isSwitching = true;
        viewerCardShellEl.classList.add('is-transitioning');
        hideWhisper();
        resetTilt(false);
        setFlipped(false);

        const mobile = isMobileViewport();
        // Mobile: vertical glide (menu is above the card, so vertical reads cleaner).
        // Desktop: keep the horizontal feel.
        const outAxis = mobile ? 'translateY(14px)' : 'translateX(20px)';
        const inAxis  = mobile ? 'translateY(-14px)' : 'translateX(-20px)';
        const easing = 'cubic-bezier(0.32, 0.94, 0.36, 1)';

        await viewerCardShellEl.animate(
          [
            { opacity: 1, transform: 'translate(0,0) scale(1)', filter: 'blur(0px)' },
            { opacity: 0, transform: `${outAxis} scale(0.97)`,  filter: 'blur(1.2px)' }
          ],
          {
            duration: SWITCH_DURATION,
            easing,
            fill: 'forwards'
          }
        ).finished;

        currentCardId = targetCard.id;
        renderCard(targetCard);
        renderMenu();

        viewerCardShellEl.animate(
          [
            { opacity: 0, transform: `${inAxis} scale(0.97)`,   filter: 'blur(1.2px)' },
            { opacity: 1, transform: 'translate(0,0) scale(1)', filter: 'blur(0px)' }
          ],
          {
            duration: SWITCH_DURATION + 60,
            easing,
            fill: 'forwards'
          }
        );

        window.setTimeout(() => {
          viewerCardShellEl.classList.remove('is-transitioning');
          viewerCardShellEl.style.opacity = '';
          viewerCardShellEl.style.transform = '';
          viewerCardShellEl.style.filter = '';
          isSwitching = false;
          cacheOathRects();
        }, SWITCH_DURATION + 80);
      }

      function handleMenuSelection(cardId, menuButton) {
        const targetCard = getCardById(cardId);
        if (!targetCard || isSwitching || isStoryAnimating) {
          return;
        }

        lastFocusedMenuButton = menuButton;
        setMobileMenuOpen(false);

        if (targetCard.locked && !isCardUnlocked(targetCard)) {
          hideWhisper();
          showUnlockModal(targetCard);
          return;
        }

        if (targetCard.id === currentCardId) {
          return;
        }

        animateSwitch(targetCard);
      }

      function showUnlockModal(card) {
        hideWhisper();
        activeModalCardId = card.id;
        unlockOverlayEl.classList.add('is-visible');
        unlockOverlayEl.setAttribute('aria-hidden', 'false');
        window.setTimeout(() => {
          unlockInputEl.focus();
          unlockInputEl.select();
        }, 180);
      }

      function hideUnlockModal(restoreFocus = true) {
        unlockOverlayEl.classList.remove('is-visible');
        unlockOverlayEl.setAttribute('aria-hidden', 'true');
        unlockInputEl.value = '';
        unlockInputEl.classList.remove('is-error');
        unlockInputEl.removeAttribute('aria-invalid');
        if (unlockStatusEl) unlockStatusEl.textContent = '';
        activeModalCardId = null;

        if (restoreFocus && lastFocusedMenuButton) {
          lastFocusedMenuButton.focus();
        }
      }

      async function tryUnlock() {
        if (!activeModalCardId || isUnlockingLockedArchive) {
          return;
        }

        const card = getCardById(activeModalCardId);
        if (!card) {
          return;
        }

        isUnlockingLockedArchive = true;
        unlockInputEl.disabled = true;
        if (unlockConfirmEl) unlockConfirmEl.disabled = true;
        if (unlockStatusEl) unlockStatusEl.textContent = '確認中';

        try {
          await unlockCardWithPassword(card, unlockInputEl.value);
          if (unlockStatusEl) unlockStatusEl.textContent = '已開啟';
          renderMenu();
          hideUnlockModal(false);
          animateSwitch(card);
          return;
        } catch (error) {
          unlockInputEl.classList.remove('is-error');
          void unlockInputEl.offsetWidth;
          unlockInputEl.classList.add('is-error');
          unlockInputEl.setAttribute('aria-invalid', 'true');
          if (unlockStatusEl) unlockStatusEl.textContent = '密碼未能開啟';
          window.setTimeout(() => {
            unlockInputEl.classList.remove('is-error');
            unlockInputEl.select();
          }, 420);
        } finally {
          isUnlockingLockedArchive = false;
          unlockInputEl.disabled = false;
          if (unlockConfirmEl) unlockConfirmEl.disabled = false;
        }
      }

      function initFlipAndTilt() {
        cardFlipEl.addEventListener('click', event => {
          if (event.target.closest('[data-no-flip]') || isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          isFlipAnimating = true;
          setFlipped(!isFlipped);
          resetTilt(false);
          cardFlipEl.addEventListener('transitionend', () => {
            isFlipAnimating = false;
          }, { once: true });
        });

        cardSceneEl.addEventListener('mousemove', event => {
          if (isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          applyTiltFromPoint(event.clientX, event.clientY, DESKTOP_TILT_STRENGTH);
        });

        cardSceneEl.addEventListener('mouseleave', () => {
          if (isStoryOpen || isStoryAnimating) {
            resetTilt(false);
            return;
          }
          resetTilt(true);
        });

        cardSceneEl.addEventListener('touchstart', event => {
          const touch = event.touches[0];
          if (!touch) {
            return;
          }

          touchStartedOnNoFlip = Boolean(event.target.closest('[data-no-flip]'));
          touchTiltActive = false;
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });

        cardSceneEl.addEventListener('touchmove', event => {
          if (touchStartedOnNoFlip || isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          const touch = event.touches[0];
          if (!touch) {
            return;
          }

          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          if (!touchTiltActive && Math.hypot(dx, dy) < TOUCH_TILT_THRESHOLD) {
            return;
          }

          touchTiltActive = true;
          if (event.cancelable) {
            event.preventDefault();
          }
          applyTiltFromPoint(touch.clientX, touch.clientY, MOBILE_TILT_STRENGTH);
        }, { passive: false });

        cardSceneEl.addEventListener('touchend', event => {
          const changedTouch = event.changedTouches[0];
          const dx = changedTouch ? changedTouch.clientX - touchStartX : 0;
          const dy = changedTouch ? changedTouch.clientY - touchStartY : 0;
          const startedOnNoFlip = touchStartedOnNoFlip;
          const wasTouchTilting = touchTiltActive;

          touchStartedOnNoFlip = false;
          touchTiltActive = false;

          if (wasTouchTilting) {
            if (event.cancelable) {
              event.preventDefault();
            }
            resetTilt(true);
          }

          if (startedOnNoFlip || isFlipAnimating || isCardMotionLocked()) {
            return;
          }

          if (!wasTouchTilting && Math.abs(dx) < TAP_FLIP_THRESHOLD && Math.abs(dy) < TAP_FLIP_THRESHOLD) {
            if (event.cancelable) {
              event.preventDefault();
            }
            cardFlipEl.click();
          }
        }, { passive: false });

        cardSceneEl.addEventListener('touchcancel', () => {
          const wasTouchTilting = touchTiltActive;
          touchStartedOnNoFlip = false;
          touchTiltActive = false;
          if (wasTouchTilting) {
            resetTilt(true);
          }
        }, { passive: true });
      }

      function initOathPainting() {
        cardFlipEl.addEventListener('pointermove', event => {
          queueOathPaint(event.clientX, event.clientY);
        });

        cardFlipEl.addEventListener('pointerleave', () => {
          clearOathPaint();
        });

        cardFlipEl.addEventListener('touchstart', event => {
          if (!isFlipped) {
            return;
          }
          const touch = event.touches[0];
          if (!touch) {
            return;
          }
          cacheOathRects();
          queueOathPaint(touch.clientX, touch.clientY);
        }, { passive: true });

        cardFlipEl.addEventListener('touchmove', event => {
          if (!isFlipped) {
            return;
          }
          const touch = event.touches[0];
          if (!touch) {
            return;
          }
          queueOathPaint(touch.clientX, touch.clientY);
        }, { passive: true });

        cardFlipEl.addEventListener('touchend', () => {
          clearOathPaint();
        }, { passive: true });
      }

      photoFrameEl.addEventListener('click', () => {
        openStoryPanel(currentCard);
      });

      storyCloseButtonEl.addEventListener('click', () => {
        closeStoryPanel({ restoreFocus: true });
      });

      storyPanelShellEl.addEventListener('click', event => {
        if (event.target === storyPanelShellEl && window.matchMedia('(max-width: 1080px)').matches) {
          closeStoryPanel({ restoreFocus: true });
        }
      });

      sealedNameButtonEl.addEventListener('click', showWhisper);
      sealedNameButtonEl.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          showWhisper();
        }
      });

      unlockOverlayEl.addEventListener('click', event => {
        if (event.target === unlockOverlayEl) {
          hideUnlockModal();
        }
      });

      if (unlockFormEl) {
        unlockFormEl.addEventListener('submit', event => {
          event.preventDefault();
          void tryUnlock();
        });
      }

      unlockInputEl.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          hideUnlockModal();
        }
      });

      unlockInputEl.addEventListener('keyup', event => {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          void tryUnlock();
        }
      });

      if (unlockConfirmEl) {
        unlockConfirmEl.addEventListener('click', () => {
          void tryUnlock();
        });
      }

      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') {
          return;
        }

        if (unlockOverlayEl.classList.contains('is-visible')) {
          hideUnlockModal();
          return;
        }

        if (isStoryOpen && !isStoryAnimating) {
          closeStoryPanel({ restoreFocus: true });
          return;
        }

        if (staffMenuPanelEl && staffMenuPanelEl.classList.contains('is-menu-open')) {
          setMobileMenuOpen(false);
          if (mobileMenuToggleEl) {
            mobileMenuToggleEl.focus();
          }
          return;
        }

        hideWhisper();
      });

      window.addEventListener('resize', () => {
        cacheOathRects();
      });

      if ('ResizeObserver' in window) {
        new ResizeObserver(cacheOathRects).observe(cardSceneEl);
      }

      clearStoryContent();
      initFlipAndTilt();
      initOathPainting();
      initMobileMenu();
      renderCard(currentCard);
      renderMenu();
      clearOathPaint();
    })();
  </script>
